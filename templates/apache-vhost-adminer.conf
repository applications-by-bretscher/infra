# =============================================================================
# VORLAGE – Apache-VirtualHost auf hades für die Datenbank-Weboberfläche
#
# Ziel: /etc/apache2/sites-available/db.conf   auf hades
#
# Ersetzen:  <DOMAIN>   z.B. db.letsbuild.ch
#            <ARGOS>    z.B. argos.net.letsbuild.ch
#            <PORT>     Port des Edge-Routers auf argos (Standard 8080)
#
# WARUM BASIC-AUTH: Ein erreichbares DB-Webinterface ist eines der häufigsten
# Einfallstore. Der Adminer-Login allein genügt nicht – er ist ohne Rate-Limit
# und wird permanent von Bots durchprobiert. Die vorgelagerte HTTP-Auth sorgt
# dafür, dass die Anmeldemaske gar nicht erst erscheint.
#
# Passwortdatei anlegen (einmalig, auf hades):
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/apache2/.htpasswd-db <benutzername>
#   sudo chown root:www-data /etc/apache2/.htpasswd-db
#   sudo chmod 640 /etc/apache2/.htpasswd-db
#
# Aktivieren:
#   sudo certbot --apache -d <DOMAIN>
#   sudo a2ensite db.conf && sudo apache2ctl configtest && sudo systemctl reload apache2
# =============================================================================

<VirtualHost *:80>
    ServerName <DOMAIN>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName <DOMAIN>

    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"

    <Location />
        AuthType Basic
        AuthName "Datenbank"
        AuthUserFile /etc/apache2/.htpasswd-db
        Require valid-user

        # Optional zusätzlich auf das interne Netz einschränken – dann ist die
        # Oberfläche von unterwegs nicht erreichbar:
        # Require ip 192.168.191.0/24
    </Location>

    ProxyPass        / http://<ARGOS>:<PORT>/
    ProxyPassReverse / http://<ARGOS>:<PORT>/

    # Grosszügiger Timeout: Importe grosser Dumps dauern
    ProxyTimeout 600

    ErrorLog  ${APACHE_LOG_DIR}/<DOMAIN>-error.log
    CustomLog ${APACHE_LOG_DIR}/<DOMAIN>-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/<DOMAIN>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/<DOMAIN>/privkey.pem
</VirtualHost>
