# =============================================================================
# VORLAGE – Apache-VirtualHost auf hades (öffentlicher Server)
#
# Ziel: /etc/apache2/sites-available/<app>.conf   auf hades
#
# Ersetzen:  <DOMAIN>   z.B. meine-app.ch   bzw.   staging.meine-app.ch
#            <ARGOS>    Hostname des Docker-Servers, z.B. argos.net.letsbuild.ch
#            <PORT>     Port des Edge-Routers auf argos (Standard 8080)
#
# Das Entscheidende: Diese Datei ist für JEDE App und JEDE Umgebung identisch,
# bis auf ServerName und Zertifikatspfade. Keine App-spezifischen Ports, keine
# Pfad-Regeln, keine WebSocket-Sonderfälle mehr – das übernimmt Caddy auf argos,
# versioniert im jeweiligen App-Repo statt hier auf dem Server.
#
# Aktivieren:
#   sudo a2ensite <app>.conf && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Benötigte Apache-Module (einmalig auf hades):
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
# =============================================================================

<VirtualHost *:80>
    ServerName <DOMAIN>
    # Alles auf HTTPS umleiten – ausser der ACME-Prüfung von certbot.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName <DOMAIN>

    # Host-Header unverändert weiterreichen – Caddy auf argos routet danach!
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Backend muss wissen, dass die Verbindung aussen HTTPS war
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # ── WebSockets (socket.io läuft unter /ws) ──────────────────────────────
    # Muss VOR den ProxyPass-Regeln stehen, sonst greift die generische Regel.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://<ARGOS>:<PORT>/$1 [P,L]

    # ── Alles andere an den Edge-Router auf argos ───────────────────────────
    # Eine einzige Regel: die Aufteilung /api vs. / macht Caddy.
    ProxyPass        / http://<ARGOS>:<PORT>/
    ProxyPassReverse / http://<ARGOS>:<PORT>/

    # Grosszügiger Timeout für Uploads und lange Requests (z.B. Transkription)
    ProxyTimeout 300

    ErrorLog  ${APACHE_LOG_DIR}/<DOMAIN>-error.log
    CustomLog ${APACHE_LOG_DIR}/<DOMAIN>-access.log combined

    # ── TLS (von certbot verwaltet) ─────────────────────────────────────────
    # Zertifikat anfordern mit:
    #   sudo certbot --apache -d <DOMAIN>
    # certbot trägt die folgenden Zeilen normalerweise selbst ein:
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/<DOMAIN>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/<DOMAIN>/privkey.pem
</VirtualHost>
