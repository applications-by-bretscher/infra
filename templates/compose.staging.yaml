# =============================================================================
# VORLAGE – Staging-Override
# Kopieren nach: compose.staging.yaml im Wurzelverzeichnis der neuen App.
#
# Identisch zu compose.prod.yaml, ausser:
#   - Image-Namen und Aliase enthalten "-staging"
#   - deploy.sh nutzt den Compose-Projektnamen <APP_NAME>-staging
# Dadurch laufen beide Umgebungen auf demselben Server ohne Kollision:
# eigene Container, eigene Volumes, eigene Datenbank (via 010_backend/.env).
#
# Anpassen: <INTERNAL_NETWORK> und ggf. Volumes/Target – wie bei prod.
# =============================================================================
services:
  backend:
    image: ${APP_NAME:?APP_NAME fehlt in .env}-staging-backend:${IMAGE_TAG:-latest}
    build:
      target: runtime
    environment:
      # Bewusst production: Staging soll sich verhalten wie Prod, nur mit anderen Daten.
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      <INTERNAL_NETWORK>:
      edge:
        aliases:
          - ${APP_NAME}-staging-backend

  frontend:
    image: ${APP_NAME}-staging-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./020_frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL fehlt in .env}
    restart: unless-stopped
    networks:
      <INTERNAL_NETWORK>:
      edge:
        aliases:
          - ${APP_NAME}-staging-frontend

networks:
  edge:
    external: true

volumes:
  uploads_data:
  logs_data:
