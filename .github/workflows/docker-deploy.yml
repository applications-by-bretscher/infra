# =============================================================================
# ZENTRALER, WIEDERVERWENDBARER DEPLOY-WORKFLOW
#
# Jede App ruft ihn mit ~15 Zeilen auf (siehe templates/github-workflow-deploy.yml):
#   uses: applications-by-bretscher/infra/.github/workflows/docker-deploy.yml@main
#
# Läuft auf dem self-hosted Runner (hades) und macht genau eines: per SSH das
# zentrale deploy.sh auf argos starten. Die gesamte Deploy-Logik (Backup,
# Migration, Health-Check, Rollback) steckt in bin/deploy.sh – der Workflow
# bleibt dumm und damit wartungsarm.
#
# ── KEINE SECRETS NÖTIG ──────────────────────────────────────────────────────
# Der Runner läuft auf hades, und der SSH-Key liegt dort bereits unter
# ~gh-runner/.ssh/. Ihn erst zu GitHub hochzuladen, damit GitHub ihn auf
# dieselbe Maschine zurückschickt, wäre ein Umweg – nötig nur bei Cloud-Runnern.
#
# Nebeneffekt: Der private Schlüssel verlässt hades nie, und private Repos
# funktionieren auch auf dem GitHub-Free-Plan (dort greifen Organisations-
# Secrets nur bei öffentlichen Repos).
#
# Voraussetzung auf hades, einmalig als Benutzer gh-runner:
#   ~/.ssh/id_deploy            der private Schlüssel
#   ~/.ssh/config               Host-Eintrag mit User und IdentityFile
#   ~/.ssh/known_hosts          Hostkey von argos bereits akzeptiert
# =============================================================================
name: Docker Deploy (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: 'App-Name = Verzeichnis unter /srv/apps'
        required: true
        type: string
      environment:
        description: 'production oder staging'
        required: true
        type: string
      ref:
        description: 'Branch/Tag/SHA, der deployt wird'
        required: true
        type: string
      docker_host:
        description: 'Docker-Server, auf dem deployt wird (kein Geheimnis – interner Hostname)'
        required: false
        default: 'argos.net.letsbuild.ch'
        type: string
      app_root:
        description: 'Basisverzeichnis der Apps auf dem Docker-Server'
        required: false
        default: '/srv/apps'
        type: string
      deploy_script:
        description: 'Zentrales Deploy-Skript auf dem Docker-Server'
        required: false
        default: '/srv/infra/bin/deploy.sh'
        type: string
      timeout_minutes:
        required: false
        default: 30
        type: number

jobs:
  deploy:
    name: ${{ inputs.app }} / ${{ inputs.environment }}
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: SSH-Verbindung pruefen
        run: |
          set -euo pipefail
          # BatchMode: niemals interaktiv nachfragen. Fehlt der Schluessel oder
          # ist der Hostkey unbekannt, soll der Job sofort scheitern statt zu haengen.
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 \
                 "${{ inputs.docker_host }}" 'echo ok' >/dev/null; then
            echo "::error::SSH zu ${{ inputs.docker_host }} nicht moeglich."
            echo "Auf hades als gh-runner pruefen:"
            echo "  sudo -u gh-runner ssh -o BatchMode=yes ${{ inputs.docker_host }} 'echo ok'"
            echo "Noetig sind ~gh-runner/.ssh/id_deploy, ein passender Eintrag in"
            echo "~gh-runner/.ssh/config und der Hostkey in ~gh-runner/.ssh/known_hosts."
            exit 1
          fi

      - name: Deploy ausloesen
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "${{ inputs.docker_host }}" \
            "cd '${{ inputs.app_root }}/${{ inputs.app }}/${{ inputs.environment }}' \
             && '${{ inputs.deploy_script }}' '${{ inputs.environment }}' '${{ inputs.ref }}'"
