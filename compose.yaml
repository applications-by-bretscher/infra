# =============================================================================
# Geteilte Infrastruktur – EINMALIG pro Docker-Server (argos), app-unabhängig.
#
#   Internet → hades (Apache, TLS/Let's Encrypt) → argos:8080 (Caddy)
#              → richtiger App-Container je nach Domain und Pfad
#
# Enthält alles, was mehrere Apps und Umgebungen gemeinsam nutzen:
#   caddy    Edge-Router – verteilt nach Domain und Pfad
#   ollama   LLM-Inferenz
#   whisper  Transkription
#
# Caddy macht bewusst KEIN TLS und KEIN Let's Encrypt – das erledigt Apache auf
# hades. Caddy ist nur der Verteiler, damit hades pro App immer denselben Port
# anspricht und keine Portbuchhaltung nötig ist.
#
# ollama und whisper stehen hier statt in den App-Stacks, weil sie zustandslos
# sind, keine App-Daten halten und ihre Modelle gross sind (~3 GB bei Whisper).
# Eine eigene Instanz je Umgebung würde Speicher und RAM vervielfachen, ohne
# etwas zu gewinnen. Die Apps erreichen sie über das edge-Netz unter:
#   http://ollama:11434   ·   http://whisper:8000
#
# Setup:
#   docker network create edge
#   docker compose -f /srv/infra/compose.yaml up -d
#
# Caddy nach Snippet-Änderung neu laden (ohne Downtime für andere Apps):
#   docker compose -f /srv/infra/compose.yaml exec caddy \
#     caddy reload --config /etc/caddy/Caddyfile
# =============================================================================
name: infra

services:
  # ── Edge-Router ─────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Nur HTTP und nur intern erreichbar. TLS terminiert Apache auf hades.
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy_config:/config
    networks:
      - edge

  # ── MySQL – zentrale Datenbank für alle Apps ────────────────────────────────
  # Eine Instanz, viele Datenbanken (eine je App und Umgebung):
  #   musig_elgg_staging · rotary_staging · …
  #
  # Erreichbar für die App-Container über das edge-Netz als Host "mysql".
  # Der Host-Port ist standardmässig an 127.0.0.1 gebunden – die DB ist damit
  # NICHT aus dem Netz erreichbar, wohl aber lokal für Dumps und Imports.
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt in /srv/infra/.env}
    command:
      # utf8mb4 als Standard – sonst scheitern Emojis und Sonderzeichen
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # SQL-Dateien hier ablegen, um beim ERSTEN Start Datenbanken anzulegen.
      # Wirkt nur bei leerem Volume – später von Hand oder über Adminer arbeiten.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - edge

  # ── Adminer – Weboberfläche für die Datenbank ───────────────────────────────
  # Erreichbar über hades unter einer eigenen Domain, dort mit HTTP-Basic-Auth
  # geschützt (siehe templates/apache-vhost-adminer.conf). Ein offenes
  # DB-Webinterface ist eines der häufigsten Einfallstore – deshalb NIE ohne
  # vorgelagerte Authentifizierung veröffentlichen.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge

  # ── Ollama (LLM) ────────────────────────────────────────────────────────────
  # Läuft standardmässig auf CPU. Mit echter NVIDIA-GPU zusätzlich
  # compose.gpu.yaml einbinden.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edge

  # ── Whisper (Transkription, CPU) ────────────────────────────────────────────
  whisper:
    build:
      context: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      # Modell-Cache bleibt über Neustarts erhalten – sonst würden bei jedem
      # Start mehrere GB neu geladen.
      - ./whisper/models:/app/models
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_config:
  ollama_data:
  # Die Nutzdaten aller App-Datenbanken. Dieses Volume ist der wertvollste Teil
  # des Servers – regelmässige Sicherung einrichten (siehe docs/database.md).
  mysql_data:
